[project]
name = "hyrox-processor"
version = "0.1.0"
description = "Microservicio de procesado: consume MQTT y persiste en InfluxDB"
authors = [{ name = "Haritz Blanco Bello" }]
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1.0",
    "influxdb-client>=1.43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
hyrox-processor = "processor.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]