# Deployment del procesador para la EVALUACIÓN EXPERIMENTAL.
#
# Idéntico al de producción (misma imagen del registro, TLS + autenticación
# contra el broker en 8883) salvo:
#   - --metrics-interval 2 → emite una línea JSON de métricas cada 2 s por stdout,
#   - --log-level WARNING → silencia el log de progreso para no ensuciar kubectl logs
#     (las líneas de métricas se imprimen con print, no por el logger).
#
# La colocación replica la de producción: réplicas en los nodos de cómputo
# (node-role=compute) con anti-afinidad preferida entre sí, de modo que 2 réplicas
# caen una por worker y el escalado añade CPU real en vez de repartir el mismo
# núcleo. Broker e InfluxDB quedan aislados en k3s-hyrox.
#
# replicas arranca en 1; el orquestador (run_matrix.sh) lo escala a 1/2/4 por corrida.
# Durante la matriz el HPA debe estar borrado y el auto-sync de ArgoCD pausado:
# ambos revertirían el escalado manual.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  namespace: hyrox
  labels:
    app.kubernetes.io/name: processor
    app.kubernetes.io/component: stream-processor
    app.kubernetes.io/part-of: hyrox-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processor
        app.kubernetes.io/component: stream-processor
        app.kubernetes.io/part-of: hyrox-platform
    spec:
      nodeSelector:
        node-role: compute
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: processor
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: registry-haritzblanco
      containers:
        - name: processor
          image: registry.digitalocean.com/haritzblanco/hyrox:processor-0.6.0
          imagePullPolicy: IfNotPresent
          env:
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-auth
                  key: token
            - name: BROKER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: processor-broker
                  key: username
            - name: BROKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: processor-broker
                  key: password
          args:
            - --broker-host
            - mosquitto
            - --broker-port
            - "8883"
            - --broker-username=$(BROKER_USERNAME)
            - --broker-password=$(BROKER_PASSWORD)
            - --broker-ca
            - /etc/mqtt-ca/ca.crt
            - --qos
            - "1"
            - --influx-url
            - http://influxdb:8086
            - --influx-org
            - hyrox
            - --influx-bucket
            - telemetry
            - --influx-token=$(INFLUX_TOKEN)
            - --share-group
            - processors
            - --metrics-interval
            - "2"
            - --log-level
            - WARNING
          volumeMounts:
            - name: mqtt-ca
              mountPath: /etc/mqtt-ca
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
      volumes:
        - name: mqtt-ca
          configMap:
            name: mqtt-ca
