# Valores de la plataforma. Cada clave configura el subchart del mismo nombre;
# los defaults de cada componente están en charts/<componente>/values.yaml.
#
# Aquí no hay credenciales: viven cifradas en los SealedSecret de cada
# subchart (influxdb-auth y grafana-auth) y solo el controller de Sealed
# Secrets del clúster puede descifrarlas. Para consultarlas una vez
# desplegadas:
#   kubectl get secret influxdb-auth -n hyrox -o jsonpath='{.data.token}' | base64 -d
