apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  labels:
    app.kubernetes.io/name: processor
    app.kubernetes.io/component: stream-processor
    app.kubernetes.io/part-of: hyrox-platform
spec:
  # Sin replicas: las gestiona el HPA. Con --share-group el broker entrega
  # cada lectura a una sola réplica, sin escrituras duplicadas.
  selector:
    matchLabels:
      app.kubernetes.io/name: processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processor
        app.kubernetes.io/component: stream-processor
        app.kubernetes.io/part-of: hyrox-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.metricsPort | quote }}
    spec:
      # Solo en nodos de cómputo, nunca junto al broker y la base de datos:
      # compartir nodo con el broker estrangula al procesador. La anti-afinidad
      # reparte las réplicas entre workers.
      nodeSelector:
        node-role: compute
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: processor
                topologyKey: kubernetes.io/hostname
      # Credenciales de descarga del registro privado (DOCR), en el SealedSecret
      # registry-haritzblanco.
      imagePullSecrets:
        - name: registry-haritzblanco
      containers:
        - name: processor
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-auth
                  key: token
            - name: BROKER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: processor-broker
                  key: username
            - name: BROKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: processor-broker
                  key: password
          args:
            - --broker-host
            - mosquitto
            - --broker-port
            - "8883"
            - --broker-username=$(BROKER_USERNAME)
            - --broker-password=$(BROKER_PASSWORD)
            - --broker-ca
            - /etc/mqtt-ca/ca.crt
            - --qos
            - "1"
            - --influx-url
            - http://influxdb:8086
            - --influx-org
            - hyrox
            - --influx-bucket
            - telemetry
            # Forma con igual: el token generado por InfluxDB puede empezar
            # por guion y argparse lo confundiria con otra opcion.
            - --influx-token=$(INFLUX_TOKEN)
            - --share-group
            - {{ .Values.shareGroup }}
            - --log-level
            - {{ .Values.logLevel }}
            - --metrics-port
            - {{ .Values.metricsPort | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          # Vida del proceso, deliberadamente ajena al broker: si la sonda
          # dependiera de la conexión, una caída del broker reiniciaría a la vez
          # todas las réplicas, que es justo cuando conviene que sigan en pie
          # reintentando. De eso ya se ocupa el reintento del consumidor.
          # El interprete tarda unos cinco segundos en levantar el servidor, asi
          # que las primeras consultas se retrasan hasta pasado ese arranque.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          # Disponibilidad: solo cuenta como lista la réplica cuya suscripción
          # compartida ha aceptado el broker, que es la que consume. Marca el
          # fin del despliegue y deja fuera del promedio de CPU del HPA a las
          # réplicas que aún están conectando, durante el arranque en frío.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 8
            periodSeconds: 5
          volumeMounts:
            - name: mqtt-ca
              mountPath: /etc/mqtt-ca
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: mqtt-ca
          configMap:
            name: mqtt-ca
