apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  labels:
    app.kubernetes.io/name: processor
    app.kubernetes.io/component: stream-processor
    app.kubernetes.io/part-of: hyrox-platform
spec:
  # Sin replicas: las gestiona el HPA. Con --share-group el broker entrega
  # cada lectura a una sola réplica, sin escrituras duplicadas.
  selector:
    matchLabels:
      app.kubernetes.io/name: processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processor
        app.kubernetes.io/component: stream-processor
        app.kubernetes.io/part-of: hyrox-platform
    spec:
      # Solo en nodos de cómputo, nunca junto al broker y la base de datos:
      # compartir nodo con el broker estrangula al procesador. La anti-afinidad
      # reparte las réplicas entre workers.
      nodeSelector:
        node-role: compute
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: processor
                topologyKey: kubernetes.io/hostname
      containers:
        - name: processor
          image: {{ .Values.image }}
          # Imagen importada en la containerd local de cada nodo (sin registry).
          imagePullPolicy: IfNotPresent
          env:
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-auth
                  key: token
          args:
            - --broker-host
            - mosquitto
            - --broker-port
            - "1883"
            - --qos
            - "1"
            - --influx-url
            - http://influxdb:8086
            - --influx-org
            - hyrox
            - --influx-bucket
            - telemetry
            # Forma con igual: el token generado por InfluxDB puede empezar
            # por guion y argparse lo confundiria con otra opcion.
            - --influx-token=$(INFLUX_TOKEN)
            - --share-group
            - {{ .Values.shareGroup }}
            - --log-level
            - {{ .Values.logLevel }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
