# Credenciales de descarga del registro privado (DigitalOcean Container
# Registry), cifradas con la clave del controller de Sealed Secrets. Las usan
# los pods del procesador y de mosquitto para descargar sus imagenes de
# registry.digitalocean.com/haritzblanco. Regenerar (las credenciales de DOCR
# caducan y hay que refrescarlas):
#   doctl registry kubernetes-manifest --namespace hyrox | kubeseal --format yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: registry-haritzblanco
  namespace: hyrox
  labels:
    app.kubernetes.io/part-of: hyrox-platform
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: registry-haritzblanco
      namespace: hyrox
      labels:
        app.kubernetes.io/part-of: hyrox-platform
    type: kubernetes.io/dockerconfigjson
