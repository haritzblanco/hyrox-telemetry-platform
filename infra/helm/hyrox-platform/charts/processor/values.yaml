image: hyrox/processor:0.5.0
shareGroup: processors
logLevel: INFO
resources:
  requests:
    # 200m es la capacidad nominal medida de una réplica (~195 mCPU
    # sosteniendo 1.000 msg/s sin pérdida). El HPA escala sobre este request.
    cpu: 200m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 256Mi
autoscaling:
  minReplicas: 1
  maxReplicas: 4
  # Caudal que una réplica atiende con pérdida despreciable (campaña de
  # julio de 2026): el pico de diseño de 800 msg/s entra con 2 réplicas.
  targetMessagesPerSecond: 400
  exporterPort: 9090
  # Disparador de respaldo si el exporter no responde.
  targetCPU: 75
