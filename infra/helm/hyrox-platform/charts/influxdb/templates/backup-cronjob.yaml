{{- if .Values.backup.enabled }}
# Backup lógico diario del bucket telemetry a un VPS externo por SFTP.
# El motor de InfluxDB OSS no permite backup completo sin token de operador
# (que este cluster no tiene), asi que se exporta el bucket como CSV anotado,
# se comprime y se sube fuera del cluster. Dos fases: el initContainer exporta
# con el token de la plataforma; el contenedor de rclone sube y aplica
# retencion. Restauracion: influx write --format csv del fichero descomprimido.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: influxdb-backup
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: hyrox-platform
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: backup
              emptyDir: {}
            - name: ssh
              secret:
                secretName: influxdb-backup-ssh
                defaultMode: 0400
          initContainers:
            - name: export
              image: {{ .Values.image }}
              imagePullPolicy: IfNotPresent
              env:
                - name: INFLUX_HOST
                  value: http://influxdb:8086
                - name: INFLUX_ORG
                  value: hyrox
                - name: INFLUX_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: influxdb-auth
                      key: token
              command:
                - bash
                - -c
                - |
                  set -eo pipefail
                  ts=$(date -u +%Y%m%d-%H%M%S)
                  out=/backup/telemetry-$ts.csv

                  # El volcado se pide por ventanas en vez de con una sola
                  # consulta con range(start: 0). Con el bucket entero, InfluxDB
                  # materializa todo el resultado y se sale de su limite de
                  # memoria: el 2026-08-09 lo mato el propio backup (OOMKilled a
                  # los 80 s) y el fallo era ya diario. La ventana es de un dia
                  # porque una sola jornada de campana experimental (600.000
                  # lecturas el 2026-08-09) basta para tumbarlo: con ventanas
                  # mensuales agosto seguia sin caber. Asi el pico de memoria
                  # depende del dia mas cargado, no del bucket acumulado.
                  #
                  # El CSV anotado admite varios bloques concatenados: cada
                  # ventana aporta su cabecera de anotaciones y `influx write
                  # --format csv` los lee en secuencia al restaurar.
                  v={{ .Values.backup.exportFrom }}
                  hasta=$(date -u -d "tomorrow" +%Y-%m-%dT00:00:00Z)
                  while [ "$(date -u -d "$v" +%s)" -lt "$(date -u -d "$hasta" +%s)" ]; do
                    fin=$(date -u -d "$v +1 day" +%Y-%m-%dT00:00:00Z)
                    influx query "from(bucket:\"telemetry\")
                        |> range(start: $v, stop: $fin)
                        |> drop(columns:[\"_start\",\"_stop\"])" --raw >> $out
                    v=$fin
                  done
                  echo "volcado hasta $hasta, $(wc -l < $out) lineas"

                  gzip $out
                  ls -la /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: {{ .Values.backup.rcloneImage }}
              imagePullPolicy: IfNotPresent
              env:
                - name: RCLONE_CONFIG_VPS_TYPE
                  value: sftp
                - name: RCLONE_CONFIG_VPS_HOST
                  value: {{ .Values.backup.sftp.host | quote }}
                - name: RCLONE_CONFIG_VPS_USER
                  value: {{ .Values.backup.sftp.user | quote }}
                - name: RCLONE_CONFIG_VPS_KEY_FILE
                  value: /keys/id_ed25519
                - name: RCLONE_CONFIG_VPS_KNOWN_HOSTS_FILE
                  value: /keys/known_hosts
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  rclone copy /backup VPS:{{ .Values.backup.sftp.path }} -v
                  # El filtro acota el borrado a los propios backups. `rclone
                  # delete` recorre todo el arbol, y el destino coincidia con el
                  # directorio personal del usuario de SFTP: el 2026-08-06 la
                  # retencion se llevo por antiguedad su .ssh/authorized_keys y
                  # dejo el backup sin poder autenticarse hasta el 2026-08-09.
                  rclone delete VPS:{{ .Values.backup.sftp.path }} --min-age {{ .Values.backup.retentionHours }}h --include "telemetry-*.csv.gz" -v || true
                  rclone ls VPS:{{ .Values.backup.sftp.path }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: ssh
                  mountPath: /keys
                  readOnly: true
{{- end }}
