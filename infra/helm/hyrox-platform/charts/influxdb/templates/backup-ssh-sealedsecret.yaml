# Clave SSH (privada) y known_hosts del VPS de backups, cifrados con el
# controller de Sealed Secrets. Los usa el CronJob de backup para subir el
# volcado por SFTP a 209.38.107.95. Regenerar (si cambia la clave o el host):
#   ssh-keygen -t ed25519 -f id_ed25519 -N ''   # y añadir la .pub al VPS
#   ssh-keyscan <ip> > known_hosts               # todas las claves de host
#   kubectl create secret generic influxdb-backup-ssh -n hyrox \
#     --from-file=id_ed25519 --from-file=known_hosts --dry-run=client -o yaml \
#     | kubeseal --controller-name sealed-secrets-controller \
#         --controller-namespace kube-system --format yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: influxdb-backup-ssh
  namespace: hyrox
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: hyrox-platform
spec:
  encryptedData:
    id_ed25519: 
    known_hosts: 
  template:
    metadata:
      name: influxdb-backup-ssh
      namespace: hyrox
      labels:
        app.kubernetes.io/name: influxdb
        app.kubernetes.io/component: backup
        app.kubernetes.io/part-of: hyrox-platform
