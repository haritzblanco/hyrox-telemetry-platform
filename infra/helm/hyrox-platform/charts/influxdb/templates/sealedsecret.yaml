# Credenciales de InfluxDB cifradas con la clave publica del controller de
# Sealed Secrets. Solo el controller del cluster puede descifrarlas, por eso
# este fichero puede vivir en un repositorio publico. Para regenerarlas:
#   kubectl create secret generic influxdb-auth -n hyrox --dry-run=client -o yaml \
#     --from-literal=... | kubeseal --format yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: influxdb-auth
  namespace: hyrox
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/part-of: hyrox-platform
spec:
  encryptedData:
    bucket: 
    org: 
    password: 
    token: 
    username: 
  template:
    metadata:
      name: influxdb-auth
      namespace: hyrox
      labels:
        app.kubernetes.io/name: influxdb
        app.kubernetes.io/part-of: hyrox-platform
