image: influxdb:2.7
# El PVC local-path ata los datos a un nodo concreto; se fija el mismo para
# que el pod siempre encuentre su volumen.
nodeName: k3s-hyrox
service:
  nodePort: 30086
storage: 5Gi
# Las credenciales no van en values: viven en el SealedSecret influxdb-auth
# (templates/sealedsecret.yaml) y solo el controller del cluster las descifra.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
# Backup lógico diario del bucket telemetry a un VPS externo por SFTP. La clave
# SSH y el known_hosts van cifrados en el SealedSecret influxdb-backup-ssh.
backup:
  enabled: true
  schedule: "0 3 * * *"        # diario 03:00 UTC
  retentionHours: 168          # conservar 7 días en el VPS
  rcloneImage: rclone/rclone:1
  sftp:
    host: "209.38.107.95"
    user: root
    path: /srv/hyrox-backups
