apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/part-of: hyrox-platform
data:
  mosquitto.conf: |
    # Sin autenticación: entorno de pruebas aislado. Para producción,
    # allow_anonymous false con password_file o TLS mutuo.

    listener 1883
    protocol mqtt
    allow_anonymous true

    # Persistencia de mensajes retained y QoS 1/2 entre reinicios
    persistence true
    persistence_location /mosquitto/data/

    # Logs por stdout para que kubectl logs los recoja directamente
    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    log_type information

    max_connections -1

    # Cola por suscriptor QoS 1/2 (defecto 1000): con picos de carga por encima
    # del caudal del procesador, una cola corta convierte el pico en descarte;
    # con 10000 (~3 MB) lo convierte en latencia recuperable. Dimensionado con
    # la evaluación experimental (cap. 8).
    max_queued_messages 10000
