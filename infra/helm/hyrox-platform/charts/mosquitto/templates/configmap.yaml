apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/part-of: hyrox-platform
data:
  mosquitto.conf: |
    # Dos listeners con ajustes independientes: uno externo cifrado y
    # autenticado para el simulador y el procesador, y otro plano accesible
    # solo desde el propio pod para el sidecar exporter.
    per_listener_settings true

    # Persistencia de mensajes retained y QoS 1/2 entre reinicios
    persistence true
    persistence_location /mosquitto/data/

    # Logs por stdout para que kubectl logs los recoja directamente
    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    log_type information

    max_connections -1

    # Listener externo: TLS del servidor, contraseña por cliente y ACL que
    # ata cada atleta a su propio topic. Es el único que publica el Service.
    listener 8883
    allow_anonymous false
    password_file /mosquitto/auth/passwd
    acl_file /mosquitto/config/acl
    cafile /mosquitto/certs/ca.crt
    certfile /mosquitto/certs/tls.crt
    keyfile /mosquitto/certs/tls.key
    # Cola por suscriptor QoS 1/2 (defecto 1000): con picos de carga por encima
    # del caudal del procesador, una cola corta convierte el pico en descarte;
    # con 10000 (~3 MB) lo convierte en latencia recuperable. Dimensionado con
    # la evaluación experimental (cap. 8).
    max_queued_messages 10000

    # Listener plano ligado a loopback: solo el sidecar exporter del mismo pod
    # llega aquí para leer las métricas de $SYS, nunca se expone fuera.
    listener 1883 127.0.0.1
    allow_anonymous true
    max_queued_messages 10000

  acl: |
    # Cada atleta solo puede publicar en su propio topic (identidad = usuario).
    pattern write hyrox/%u/biometrics

    # El procesador (cuenta de servicio) lee la telemetria de todos los atletas;
    # cubre tambien la suscripcion compartida $share/processors/hyrox/+/biometrics.
    user processor
    topic read hyrox/+/biometrics
