apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: hyrox-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: hyrox-platform
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Prometheus raspa el caudal que expone el sidecar exporter en /metrics.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.exporter.port | quote }}
        prometheus.io/path: /metrics
    spec:
      # Solo el sidecar exporter se descarga del registro privado (DOCR); la
      # imagen de mosquitto viene de Docker Hub y no necesita credenciales.
      # El broker va en el nodo de control, aislado de los nodos de cómputo donde
      # se reparten las réplicas del procesador. Sin esta fijación el planificador
      # lo coloca donde quiera, y cada reinicio era una moneda al aire: cuando
      # caía en un nodo de cómputo compartía sus dos vCPU con una réplica y las
      # dos se estorbaban. Medido el 2026-09-10 con la réplica fijada a cada
      # nodo: 853 msg/s con 514 m de CPU en el nodo libre, frente a 571-603 msg/s
      # quemando 963 m y con la latencia de transporte en 13 s en el nodo
      # compartido con el broker.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      imagePullSecrets:
        - name: registry-haritzblanco
      containers:
        - name: mosquitto
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt-tls
              containerPort: 8883
              protocol: TCP
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            - name: config
              mountPath: /mosquitto/config/acl
              subPath: acl
              readOnly: true
            - name: certs
              mountPath: /mosquitto/certs
              readOnly: true
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # El listener plano 1883 solo escucha en loopback, así que el kubelet
          # sondea el listener externo 8883. Un probe TCP solo abre la conexión,
          # no necesita completar el handshake TLS.
          livenessProbe:
            tcpSocket:
              port: 8883
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8883
            initialDelaySeconds: 2
            periodSeconds: 5
        # Exporter de carga como sidecar: se suscribe a $SYS por localhost y
        # sirve el caudal de publicaciones en JSON. KEDA lo consulta para
        # escalar el procesador por carga ofrecida en vez de por CPU.
        - name: exporter
          image: {{ .Values.exporter.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --broker-host
            - localhost
            - --http-port
            - {{ .Values.exporter.port | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: certs
          secret:
            secretName: mosquitto-tls
        - name: auth
          secret:
            secretName: mosquitto-passwd
        - name: data
          emptyDir: {}
