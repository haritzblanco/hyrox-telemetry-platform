image: grafana/grafana:11.1.0
nodeName: k3s-hyrox
adminUser: admin
# La password de admin y el token de InfluxDB viven en el SealedSecret
# grafana-auth (templates/sealedsecret.yaml), no en values.
plugins: marcusolsson-dynamictext-panel
service:
  nodePort: 30300
storage: 1Gi
influx:
  url: http://influxdb:8086
  org: hyrox
  bucket: telemetry
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
