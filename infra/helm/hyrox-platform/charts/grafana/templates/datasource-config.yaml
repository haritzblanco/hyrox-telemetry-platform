apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: hyrox-platform
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: InfluxDB
        type: influxdb
        access: proxy
        url: {{ .Values.influx.url }}
        uid: influxdb-hyrox
        jsonData:
          version: Flux
          organization: {{ .Values.influx.org }}
          defaultBucket: {{ .Values.influx.bucket }}
        secureJsonData:
          # Grafana lo sustituye por la variable de entorno del pod, que a su
          # vez viene del SealedSecret grafana-auth.
          token: $__env{INFLUX_TOKEN}
        isDefault: true
