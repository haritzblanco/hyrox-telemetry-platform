apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: hyrox-platform
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: InfluxDB
        type: influxdb
        access: proxy
        url: {{ .Values.influx.url }}
        uid: influxdb-hyrox
        jsonData:
          version: Flux
          organization: {{ .Values.influx.org }}
          defaultBucket: {{ .Values.influx.bucket }}
        secureJsonData:
          # Grafana lo sustituye por la variable de entorno del pod, que a su
          # vez viene del SealedSecret grafana-auth.
          token: $__env{INFLUX_TOKEN}
        isDefault: true
      # Métricas del clúster (recursos, réplicas, caudal) para el dashboard de
      # evaluación. Prometheus vive en el namespace monitoring.
      - name: Prometheus
        type: prometheus
        access: proxy
        uid: prometheus-hyrox
        url: http://prometheus-server.monitoring.svc.cluster.local
        jsonData:
          timeInterval: 20s
