apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: hyrox-platform
spec:
  replicas: 1
  strategy:
    type: Recreate # el volumen guarda un sqlite: no puede haber dos pods sobre él
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: visualization
        app.kubernetes.io/part-of: hyrox-platform
      annotations:
        # Redespliega si cambian los dashboards aprovisionados.
        checksum/dashboards: {{ include (print $.Template.BasePath "/dashboards.yaml") . | sha256sum }}
    spec:
      # Junto a la base de datos que consulta, en el plano de control; su
      # volumen local-path queda anclado a ese nodo desde el primer arranque.
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      containers:
        - name: grafana
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.adminUser }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-auth
                  key: admin-password
            # El datasource aprovisionado lo lee con $__env{INFLUX_TOKEN}.
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-auth
                  key: influx-token
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_TOKEN_ROTATION_INTERVAL_MINUTES
              value: "10080"
            - name: GF_SESSION_COOKIE_SECURE
              value: "false"
            - name: GF_INSTALL_PLUGINS
              value: {{ .Values.plugins | quote }}
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          projected:
            sources:
              {{- range $path, $file := .Files.Glob "dashboards/*.json" }}
              - configMap:
                  name: grafana-dashboard-{{ trimSuffix ".json" (base $path) }}
                  items:
                    - key: {{ base $path }}
                      path: {{ base $path }}
              {{- end }}
