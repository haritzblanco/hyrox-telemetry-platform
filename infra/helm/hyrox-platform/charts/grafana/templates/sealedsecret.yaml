# Credenciales de Grafana cifradas con la clave publica del controller de
# Sealed Secrets, igual que las de InfluxDB. El token es el mismo que usa el
# procesador, acotado a lectura y escritura de buckets de la organizacion.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-auth
  namespace: hyrox
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: hyrox-platform
spec:
  encryptedData:
    admin-password: 
    influx-token: 
  template:
    metadata:
      name: grafana-auth
      namespace: hyrox
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: hyrox-platform
