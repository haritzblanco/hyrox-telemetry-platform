# Estos manifiestos quedaron como referencia: el despliegue real lo reconcilia
# ArgoCD desde el chart de infra/helm, donde este Secret es un SealedSecret
# cifrado. Si se aplica a mano, rellenar los valores antes.
apiVersion: v1
kind: Secret
metadata:
  name: influxdb-auth
  namespace: hyrox
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/part-of: hyrox-platform
type: Opaque
stringData:
  username: admin
  password: cambiar
  org: hyrox
  bucket: telemetry
  token: cambiar
