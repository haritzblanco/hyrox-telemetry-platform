              "query": "base = from(bucket: \"telemetry\") |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"biometrics\" and r._field == \"speed\" and r.athlete_id == \"${athlete_id}\" and r.phase_type == \"run\")\n  |> group(columns: [\"phase\"]) |> mean()\n  |> map(fn: (r) => ({phase: r.phase, pace: 1000.0 / r._value}))\nmpArr = (base |> group() |> mean(column: \"pace\") |> findColumn(fn: (key) => true, column: \"pace\"))\nmp = if length(arr: mpArr) > 0 then mpArr[0] else 0.0\nbase\n  |> map(fn: (r) => ({fase: if r.phase==\"run_1\" then \"Run 1\" else if r.phase==\"run_2\" then \"Run 2\" else if r.phase==\"run_3\" then \"Run 3\" else if r.phase==\"run_4\" then \"Run 4\" else if r.phase==\"run_5\" then \"Run 5\" else if r.phase==\"run_6\" then \"Run 6\" else if r.phase==\"run_7\" then \"Run 7\" else if r.phase==\"run_8\" then \"Run 8\" else r.phase, orden: if r.phase==\"run_1\" then 1 else if r.phase==\"run_2\" then 2 else if r.phase==\"run_3\" then 3 else if r.phase==\"run_4\" then 4 else if r.phase==\"run_5\" then 5 else if r.phase==\"run_6\" then 6 else if r.phase==\"run_7\" then 7 else if r.phase==\"run_8\" then 8 else 99,\n       lento: if (r.pace - mp) > 0.0 then r.pace - mp else 0.0,\n       rapido: if (r.pace - mp) < 0.0 then r.pace - mp else 0.0}))\n  |> group() |> sort(columns: [\"orden\"]) |> keep(columns: [\"fase\", \"lento\", \"rapido\"])",
