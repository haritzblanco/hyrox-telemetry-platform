              "query": "import \"strings\"\nimport \"math\"\nfrom(bucket: \"telemetry\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"biometrics\"\n    and r._field == \"distance\"\n    and r.athlete_id == \"${athlete_id}\")\n  |> group()\n  |> max()\n  |> map(fn: (r) => ({ _value: strings.replace(v: string(v: math.round(x: r._value / 100.0) / 10.0), t: \".\", u: \",\", i: 1) + \" km\" }))",
