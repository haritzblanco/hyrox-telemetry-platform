value\"))\ntot = if length(arr: totArr) > 0 then totArr[0] else 0\n\n// duraciones crudas (1 por atleta) -> la curva (KDE) se calcula en el afterRender\ndurations\n  |> map(fn: (r) => ({duracion: r._value, adv: adv, pos: pos + 1, tot: tot}))",
