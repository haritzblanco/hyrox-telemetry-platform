          "title": "Medias por atleta",
          "type": "table",
          "targets": [
            {
              "datasource": {
                "type": "influxdb",
                "uid": "influxdb-hyrox"
              },
              "query": "base = from(bucket: \"telemetry\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"biometrics\")\n  |> filter(fn: (r) => r[\"session_id\"] =~ /${session_id}/)\n  |> filter(fn: (r) => r[\"athlete_id\"] =~ /${athlete_id:regex}/)\n\ntiempo = base\n  |> filter(fn: (r) => r._field == \"elapsed_seconds\")\n  |> group(columns: [\"athlete_id\"]) |> max()\n  |> map(fn: (r) => ({athlete_id: r.athlete_id, metric: \"tiempo\", val: float(v: r._value)}))\n\nhr = base\n  |> filter(fn: (r) => r._field == \"heart_rate\")\n  |> group(columns: [\"athlete_id\"]) |> mean()\n  |> map(fn: (r) => ({athlete_id: r.athlete_id, metric: \"hr\", val: r._value}))\n\nvel = base\n  |> filter(fn: (r) => r._field == \"speed\" and r.phase_type == \"run\")\n  |> group(columns: [\"athlete_id\"]) |> mean()\n  |> map(fn: (r) => ({athlete_id: r.athlete_id, metric: \"vel\", val: if r._value > 0.0 then 1000.0 / r._value else 0.0}))\n\nunion(tables: [tiempo, hr, vel])\n  |> group()\n  |> pivot(rowKey: [\"athlete_id\"], columnKey: [\"metric\"], valueColumn: \"val\")\n  |> sort(columns: [\"tiempo\"])",
              "refId": "A"
            }
