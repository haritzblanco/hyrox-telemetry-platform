              "query": "from(bucket: \"telemetry\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"biometrics\")\n  |> filter(fn: (r) => r[\"session_id\"] =~ /${session_id}/)\n  |> filter(fn: (r) => r[\"athlete_id\"] =~ /${athlete_id:regex}/)\n  |> filter(fn: (r) => r._field == \"elapsed_seconds\")\n  |> filter(fn: (r) => r.phase != \"roxzone\")\n  |> group(columns: [\"athlete_id\", \"phase\"])\n  |> spread()\n  |> group()\n  |> map(fn: (r) => ({\n      _time: 1970-01-01T00:00:00Z,\n      athlete_id: r.athlete_id,\n      _value: float(v: r._value),\n      run_order: if r.phase == \"run_1\" then \"01\" else if r.phase == \"skierg\" then \"02\" else if r.phase == \"run_2\" then \"03\" else if r.phase == \"sled_push\" then \"04\" else if r.phase == \"run_3\" then \"05\" else if r.phase == \"sled_pull\" then \"06\" else if r.phase == \"run_4\" then \"07\" else if r.phase == \"burpee_bj\" then \"08\" else if r.phase == \"run_5\" then \"09\" else if r.phase == \"row\" then \"10\" else if r.phase == \"run_6\" then \"11\" else if r.phase == \"farmers_carry\" then \"12\" else if r.phase == \"run_7\" then \"13\" else if r.phase == \"sandbag_lunges\" then \"14\" else if r.phase == \"run_8\" then \"15\" else if r.phase == \"wall_balls\" then \"16\" else \"99\",\n      phase_label: if r.phase == \"run_1\" then \"Run 1\" else if r.phase == \"skierg\" then \"SkiErg\" else if r.phase == \"run_2\" then \"Run 2\" else if r.phase == \"sled_push\" then \"Sled Push\" else if r.phase == \"run_3\" then \"Run 3\" else if r.phase == \"sled_pull\" then \"Sled Pull\" else if r.phase == \"run_4\" then \"Run 4\" else if r.phase == \"burpee_bj\" then \"Burpee BJ\" else if r.phase == \"run_5\" then \"Run 5\" else if r.phase == \"row\" then \"Row\" else if r.phase == \"run_6\" then \"Run 6\" else if r.phase == \"farmers_carry\" then \"Farmers Carry\" else if r.phase == \"run_7\" then \"Run 7\" else if r.phase == \"sandbag_lunges\" then \"Sandbag Lunges\" else if r.phase == \"run_8\" then \"Run 8\" else if r.phase == \"wall_balls\" then \"Wall Balls\" else r.phase\n  }))\n  |> pivot(rowKey: [\"run_order\", \"phase_label\"], columnKey: [\"athlete_id\"], valueColumn: \"_value\")\n  |> group()\n  |> sort(columns: [\"run_order\"])\n  |> drop(columns: [\"run_order\"])",
