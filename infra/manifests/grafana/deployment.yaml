apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: hyrox
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: hyrox-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: visualization
        app.kubernetes.io/part-of: hyrox-platform
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-auth
                  key: admin-password
            # El datasource aprovisionado lo lee con $__env{INFLUX_TOKEN}.
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-auth
                  key: influx-token
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_TOKEN_ROTATION_INTERVAL_MINUTES
              value: "10080"
            - name: GF_SESSION_COOKIE_SECURE
              value: "false"
            - name: GF_INSTALL_PLUGINS
              value: "marcusolsson-dynamictext-panel"
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-hyrox
                  items:
                    - key: hyrox.json
                      path: hyrox.json
              - configMap:
                  name: grafana-dashboard-hyrox-live
                  items:
                    - key: hyrox-live.json
                      path: hyrox-live.json
              - configMap:
                  name: grafana-dashboard-hyrox-analysis
                  items:
                    - key: hyrox-analysis.json
                      path: hyrox-analysis.json
              - configMap:
                  name: grafana-dashboard-hyrox-compare
                  items:
                    - key: hyrox-compare.json
                      path: hyrox-compare.json