# Aplicación ArgoCD del controller de Sealed Secrets. El manifiesto está
# vendorizado en infra/sealed-secrets/ (release oficial v0.38.4) porque el
# repositorio Helm antiguo de bitnami-labs ya no se publica. El controller
# descifra los SealedSecret del chart y crea los Secret reales en el clúster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/haritzblanco/hyrox-telemetry-platform.git
    targetRevision: main
    path: infra/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
